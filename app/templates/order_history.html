<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>注文履歴</title>
    <style>
      :root {
        --bg: #fffaf3;
        --panel: #ffffff;
        --line: #f1dfc5;
        --primary: #ef8f4c;
        --primary-dark: #d86c24;
        --text: #2f2a26;
        --muted: #726962;
        --shadow: 0 18px 35px rgba(105, 74, 30, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
        background: linear-gradient(180deg, #fff9f1 0%, #fff0d7 100%);
        color: var(--text);
      }

      .page {
        max-width: 1000px;
        margin: 64px auto;
        padding: 0 20px 40px;
      }

      .panel {
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: var(--shadow);
        padding: 28px 24px;
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(2rem, 4vw, 2.7rem);
      }

      .subtitle {
        margin: 0 0 24px;
        color: var(--muted);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 8px;
      }

      th,
      td {
        padding: 14px 12px;
        border-bottom: 1px solid var(--line);
        text-align: left;
      }

      th {
        color: var(--muted);
        font-size: 0.85rem;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .amount {
        font-weight: 700;
      }

      .actions {
        margin-top: 24px;
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }

      .actions .secondary {
        background: #fff;
        color: var(--text);
        border: 1px solid var(--line);
      }

      .actions a {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 12px;
        background: linear-gradient(
          135deg,
          var(--primary) 0%,
          var(--primary-dark) 100%
        );
        color: white;
        text-decoration: none;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="panel">
        <h1>注文履歴</h1>
        <p class="subtitle">これまでの注文を確認できます。</p>

        <table>
          <thead>
            <tr>
              <th>注文番号</th>
              <th>注文日</th>
              <th>会社名</th>
              <th>合計金額</th>
            </tr>
          </thead>
          <tbody>
            {% for order in orders %}
            <tr>
              <td>#{{ order.id }}</td>
              <td>{{ order.order_date }}</td>
              <td>{{ order.company_name }}</td>
              <td class="amount">{{ order.total_price | yen }}</td>
            </tr>
            {% endfor %}
          </tbody>
        </table>

        <div class="actions">
          <a class="secondary" href="/companies">取引先一覧</a>
          <a href="/">新しい注文をする</a>
        </div>
      </div>
    </div>
  </body>
</html>

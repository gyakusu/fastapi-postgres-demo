<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>弁当注文管理</title>
    <style>
      :root {
        --bg: #fffaf3;
        --panel: #ffffff;
        --panel-soft: #fff4db;
        --primary: #ef8f4c;
        --primary-dark: #d86c24;
        --secondary: #7dbb74;
        --accent: #f2c76b;
        --text: #2f2a26;
        --muted: #726962;
        --line: #f1dfc5;
        --danger: #c65a46;
        --shadow: 0 18px 35px rgba(105, 74, 30, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
        background: linear-gradient(180deg, #fff9f1 0%, #fff0d7 100%);
        color: var(--text);
      }

      .page {
        max-width: 1100px;
        margin: 48px auto;
        padding: 0 20px 40px;
      }

      .header {
        margin-bottom: 24px;
      }

      .eyebrow {
        display: inline-block;
        background: rgba(239, 143, 76, 0.12);
        color: var(--primary-dark);
        border: 1px solid rgba(239, 143, 76, 0.25);
        border-radius: 999px;
        padding: 7px 12px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 16px 0 8px;
        font-size: clamp(2rem, 3vw, 3rem);
        line-height: 1.2;
      }

      .subtitle {
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
      }

      .layout {
        display: grid;
        grid-template-columns: 1.6fr 0.9fr;
        gap: 24px;
        align-items: start;
      }

      .panel {
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid var(--line);
        border-radius: 22px;
        box-shadow: var(--shadow);
      }

      .form-panel {
        padding: 24px;
      }

      .summary-panel {
        position: sticky;
        top: 20px;
        padding: 24px 22px;
        background: linear-gradient(180deg, #fffaf3 0%, #fff1d8 100%);
      }

      .section-title {
        margin: 0 0 14px;
        font-size: 1.15rem;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .section-title::before {
        content: "";
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: linear-gradient(
          135deg,
          var(--primary) 0%,
          var(--accent) 100%
        );
        box-shadow: 0 0 0 4px rgba(239, 143, 76, 0.12);
      }

      .field {
        margin-bottom: 22px;
      }

      label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
      }

      select,
      input[type="date"] {
        width: 100%;
        appearance: none;
        border: 1px solid var(--line);
        background: #fff;
        border-radius: 12px;
        padding: 14px 16px;
        font-size: 1rem;
        color: var(--text);
        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease;
      }

      select:focus,
      input[type="date"]:focus,
      .qty-input:focus {
        outline: none;
        border-color: rgba(239, 143, 76, 0.8);
        box-shadow: 0 0 0 4px rgba(239, 143, 76, 0.12);
      }

      .menu-list {
        display: grid;
        gap: 14px;
        margin-top: 12px;
      }

      .menu-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 14px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: linear-gradient(180deg, #fffefb 0%, #fffaf2 100%);
      }

      .menu-label {
        flex: 1;
        min-width: 0;
      }

      .menu-name {
        font-weight: 700;
        font-size: 1.03rem;
      }

      .menu-price {
        color: var(--muted);
        font-size: 0.9rem;
        margin-top: 6px;
      }

      .quantity-control {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
        padding: 6px 8px;
      }

      .stepper {
        width: 32px;
        height: 32px;
        border: 0;
        border-radius: 10px;
        background: #f7efe3;
        color: var(--text);
        font-size: 1.2rem;
        font-weight: 700;
        cursor: pointer;
        transition:
          transform 0.15s ease,
          background 0.15s ease;
      }

      .stepper:hover {
        background: #f2e1c0;
      }

      .stepper:active {
        transform: translateY(1px);
      }

      .qty-input {
        width: 52px;
        text-align: center;
        border: 0;
        background: transparent;
        font-size: 1.05rem;
        font-weight: 700;
        color: var(--text);
      }

      .summary-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
      }

      .summary-header h2 {
        margin: 0;
        font-size: 1.2rem;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: rgba(125, 187, 116, 0.12);
        color: #2f7d35;
        border-radius: 999px;
        padding: 5px 10px;
        font-size: 0.78rem;
        font-weight: 700;
      }

      .summary-list {
        list-style: none;
        margin: 0 0 20px;
        padding: 0;
        display: grid;
        gap: 10px;
      }

      .summary-list li {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px dashed var(--line);
        color: var(--muted);
      }

      .summary-list li strong {
        color: var(--text);
      }

      .total-box {
        background: linear-gradient(135deg, #fff7ea 0%, #fde5b8 100%);
        border: 1px solid rgba(239, 143, 76, 0.25);
        border-radius: 16px;
        padding: 16px 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .total-box span {
        font-weight: 700;
      }

      .total-box strong {
        font-size: 1.5rem;
      }

      .submit-row {
        margin-top: 24px;
      }

      .submit-btn {
        width: 100%;
        border: 0;
        border-radius: 14px;
        background: linear-gradient(
          135deg,
          var(--primary) 0%,
          var(--primary-dark) 100%
        );
        color: white;
        font-size: 1.05rem;
        font-weight: 700;
        padding: 16px 18px;
        cursor: pointer;
        box-shadow: 0 12px 22px rgba(216, 108, 36, 0.22);
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease;
      }

      .submit-btn:hover {
        transform: translateY(-1px);
        box-shadow: 0 14px 24px rgba(216, 108, 36, 0.26);
      }

      .error-message {
        margin-top: 12px;
        color: var(--danger);
        font-size: 0.9rem;
        min-height: 20px;
      }

      @media (max-width: 820px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .summary-panel {
          position: static;
        }
      }
    </style>
  </head>

  <body>
    <div class="page">
      <header class="header">
        <span class="eyebrow">Bento ordering</span>
        <h1>弁当注文登録</h1>
        <p class="subtitle">
          会社名・注文日・数量を入力して、注文内容をまとめて登録できます。
        </p>
      </header>

      <div class="layout">
        <form
          class="panel form-panel"
          method="post"
          action="/orders"
          id="order-form"
        >
          <div class="field">
            <h2 class="section-title">注文元</h2>
            <select name="company_id" required id="company_id">
              <option value="">会社を選択してください</option>
              {% for company in companies %}
              <option value="{{ company.id }}">{{ company.name }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="field">
            <h2 class="section-title">注文日</h2>
            <input type="date" name="order_date" id="order_date" required />
          </div>

          <div class="field">
            <h2 class="section-title">弁当メニュー</h2>
            <div class="menu-list">
              {% for bento in bentos %}
              <div
                class="menu-item"
                data-bento-id="{{ bento.id }}"
                data-bento-price="{{ bento.price }}"
              >
                <div class="menu-label">
                  <div class="menu-name">{{ bento.name }}</div>
                  <div class="menu-price">{{ bento.price }}円 / 個</div>
                </div>

                <div class="quantity-control" aria-label="{{ bento.name }}の数量">
                  <button
                    type="button"
                    class="stepper"
                    data-action="decrease"
                    data-bento-id="{{ bento.id }}"
                    aria-label="{{ bento.name }}を1つ減らす"
                  >
                    −
                  </button>
                  <input
                    class="qty-input"
                    type="number"
                    name="quantity_{{ bento.id }}"
                    value="0"
                    min="0"
                    step="1"
                    inputmode="numeric"
                    data-bento-id="{{ bento.id }}"
                    aria-label="{{ bento.name }}の数量"
                  />
                  <button
                    type="button"
                    class="stepper"
                    data-action="increase"
                    data-bento-id="{{ bento.id }}"
                    aria-label="{{ bento.name }}を1つ増やす"
                  >
                    ＋
                  </button>
                </div>
              </div>
              {% endfor %}
            </div>
          </div>

          <div class="submit-row">
            <button type="submit" class="submit-btn">注文を登録</button>
            <div class="error-message" id="form-error" aria-live="polite"></div>
          </div>
        </form>

        <aside class="panel summary-panel" aria-live="polite">
          <div class="summary-header">
            <h2>注文概要</h2>
            <span class="badge" id="summary-badge">0件</span>
          </div>

          <ul class="summary-list" id="summary-list">
            <li>
              <span>会社</span><strong id="summary-company">未選択</strong>
            </li>
            <li>
              <span>注文日</span><strong id="summary-date">未入力</strong>
            </li>
            <li><span>小計</span><strong id="summary-subtotal">0円</strong></li>
          </ul>

          <div class="total-box">
            <span>合計</span>
            <strong id="summary-total">0円</strong>
          </div>
        </aside>
      </div>
    </div>

    <script>
      const orderDateInput = document.getElementById("order_date");
      const companySelect = document.getElementById("company_id");
      const form = document.getElementById("order-form");
      const errorBox = document.getElementById("form-error");
      const summaryCompany = document.getElementById("summary-company");
      const summaryDate = document.getElementById("summary-date");
      const summarySubtotal = document.getElementById("summary-subtotal");
      const summaryTotal = document.getElementById("summary-total");
      const summaryBadge = document.getElementById("summary-badge");

      const today = new Date();
      const month = String(today.getMonth() + 1).padStart(2, "0");
      const day = String(today.getDate()).padStart(2, "0");
      orderDateInput.value = `${today.getFullYear()}-${month}-${day}`;

      function updateSummary() {
        const companyText =
          companySelect.options[companySelect.selectedIndex]?.text || "未選択";
        const dateText = orderDateInput.value || "未入力";
        summaryCompany.textContent =
          companyText === "会社を選択してください" ? "未選択" : companyText;
        summaryDate.textContent = dateText;

        let subtotal = 0;
        let itemCount = 0;

        document.querySelectorAll(".qty-input").forEach((input) => {
          const quantity = Number(input.value || 0);
          if (quantity > 0) {
            itemCount += 1;
          }
          const bentoId = input.dataset.bentoId;
          const item = document.querySelector(`[data-bento-id="${bentoId}"]`);
          const price = Number(item?.dataset.bentoPrice || 0);
          subtotal += quantity * price;
        });

        summarySubtotal.textContent = `${subtotal.toLocaleString()}円`;
        summaryTotal.textContent = `${subtotal.toLocaleString()}円`;
        summaryBadge.textContent = `${itemCount}件`;
      }

      function updateQuantity(input, change) {
        const currentValue = Number(input.value || 0);
        const nextValue = Math.max(0, currentValue + change);
        input.value = nextValue;
        updateSummary();
      }

      document.querySelectorAll(".stepper").forEach((button) => {
        button.addEventListener("click", () => {
          const bentoId = button.dataset.bentoId;
          const input = document.querySelector(
            `.qty-input[data-bento-id="${bentoId}"]`,
          );
          const change = button.dataset.action === "increase" ? 1 : -1;
          if (input) {
            updateQuantity(input, change);
          }
        });
      });

      document.querySelectorAll(".qty-input").forEach((input) => {
        input.addEventListener("input", () => {
          input.value = input.value.replace(/[^0-9]/g, "");
          if (Number(input.value || 0) < 0) {
            input.value = 0;
          }
          updateSummary();
        });
      });

      companySelect.addEventListener("change", updateSummary);
      orderDateInput.addEventListener("change", updateSummary);
      updateSummary();

      form.addEventListener("submit", (event) => {
        const companySelected = companySelect.value;
        const dateValue = orderDateInput.value;
        const hasItem = [...document.querySelectorAll(".qty-input")].some(
          (input) => Number(input.value || 0) > 0,
        );

        if (!companySelected || !dateValue) {
          event.preventDefault();
          errorBox.textContent = "会社と注文日を入力してください。";
          return;
        }

        if (!hasItem) {
          event.preventDefault();
          errorBox.textContent = "弁当を1つ以上選択してください。";
          return;
        }

        errorBox.textContent = "";
      });
    </script>
  </body>
</html>

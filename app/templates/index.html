<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>弁当注文管理</title>
  </head>

  <body>
    <h1>弁当注文登録</h1>

    <form method="post" action="/orders">
      <h2>注文元</h2>

      <select name="company_id" required>
        <option value="">会社を選択してください</option>

        {% for company in companies %}
        <option value="{{ company[0] }}">{{ company[1] }}</option>
        {% endfor %}
      </select>

      <h2>注文日</h2>

      <input type="date" name="order_date" required />

      <h2>弁当</h2>

      {% for bento in bentos %}

      <div>
        <label>
          {{ bento[1] }} （{{ bento[2] }}円）

          <input
            type="number"
            name="quantity_{{ bento[0] }}"
            value="0"
            min="0"
          />
          個
        </label>
      </div>

      {% endfor %}

      <br />

      <button type="submit">注文を登録</button>
    </form>
  </body>
</html>
